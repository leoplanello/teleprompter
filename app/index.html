<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<style>
  :root { --bg: .55; --fg: #fff; --fs: 34px; --ff: "Segoe UI"; --hbg: rgba(255,213,74,.85); --hbgs: rgba(255,213,74,.3); --hfg: #111; --past: .35; --fut: .85; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; font-family: var(--ff), sans-serif; }
  #box { position: fixed; inset: 0; border-radius: 14px; background: rgba(0,0,0,var(--bg)); -webkit-app-region: drag; }
  body.locked #box { -webkit-app-region: no-drag; }
  #text { position: absolute; left: 22px; right: 22px; top: 12px; bottom: 30px; overflow: hidden; color: var(--fg); font-size: var(--fs); line-height: 1.4; -webkit-app-region: no-drag; }
  #inner { position: relative; will-change: transform; }
  .w { opacity: var(--fut); transition: opacity .15s, background-color .12s, color .12s; border-radius: .18em; }
  .w.done { opacity: var(--past); }
  .w.sent { opacity: 1; background-color: var(--hbgs); box-shadow: 0 0 0 .06em var(--hbgs); }
  .w.cur { opacity: 1; color: var(--hfg); background-color: var(--hbg); box-shadow: 0 0 0 .1em var(--hbg); }
  #foot { position: absolute; left: 12px; right: 10px; bottom: 6px; height: 20px; display: flex; align-items: center; gap: 8px; font: 12px "Segoe UI", sans-serif; color: rgba(255,255,255,.75); -webkit-app-region: no-drag; }
  .ib { cursor: pointer; font-size: 15px; line-height: 1; opacity: .8; border: 0; background: none; color: inherit; padding: 0 3px; }
  .ib:hover { opacity: 1; } #close:hover { color: #ff6b6b; }
  #upd { display: none; font-size: 12px; background: #2563eb; color: #fff; border-radius: 10px; padding: 1px 8px; opacity: 1; }
  #lvl { width: 54px; height: 6px; border-radius: 3px; background: rgba(255,255,255,.2); overflow: hidden; flex: none; }
  #lvl i { display: block; height: 100%; width: 0; background: #3ddc84; }
  #heard { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; direction: rtl; text-align: left; }
  #dot { width: 9px; height: 9px; border-radius: 50%; background: #3ddc84; flex: none; }
  #dot.imp { background: #ffb020; } #dot.off { background: #e5484d; }
</style>
</head>
<body>
<div id="box">
  <div id="text"><div id="inner"></div></div>
  <div id="foot">
    <button class="ib" id="gear" title="Configurações (Ctrl+Alt+S)">⚙</button>
    <button class="ib" id="upd" title="Nova versão disponível">↑ atualizar</button>
    <div id="lvl"><i></i></div>
    <div id="heard"></div>
    <div id="dot" class="off"></div>
    <button class="ib" id="close" title="Fechar (Ctrl+Alt+Q)">✕</button>
  </div>
</div>
<script>
const $ = (id) => document.getElementById(id), text = $("text"), inner = $("inner");
// ajustado com a gravação real: a leitura segue o ritmo e o destaque fica um pouco à frente
const AHEAD_MS = 250; // antecipa o destaque pelo tempo típico de confirmação do reconhecedor
let cfg = { lead: 3, scrollSmooth: 160, anchor: 0.3, highlightMode: "palavra", showHeard: true };
let chunks = [], spans = [], sentOf = [], sentLo = [], sentHi = [], total = 0;
let state = "following", connected = false;
// posição confirmada pelo reconhecedor (conf) e a mostrada (disp): a mostrada se antecipa pela velocidade de leitura
let conf = 0, confT = 0, vel = 2.5, lastProg = 0, hist = [], disp = 0, curIdx = -1;
let scrollY = 0, lastFrame = 0, lastTransform = "";

const dot = () => ($("dot").className = !connected ? "off" : state === "improvising" ? "imp" : "");
$("gear").onclick = $("upd").onclick = () => tp.openSettings();
$("close").onclick = () => tp.quit();
tp.onClickThrough((on) => document.body.classList.toggle("locked", on));
tp.onUpdate((u) => ($("upd").style.display = u.phase === "available" ? "" : "none"));

tp.onStt((s) => {
  connected = s.connected;
  $("lvl").firstChild.style.width = Math.round(s.level * 100) + "%";
  $("heard").style.display = cfg.showHeard ? "" : "none";
  $("heard").textContent = !s.connected ? "carregando o motor de voz…"
    : s.heard ? "‪" + s.heard.replaceAll("[unk]", "…") : "ouvindo… (" + s.device + ")";
  dot();
});

const rgba = (hex, a) => {
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`;
};

tp.onCfg((c) => {
  const modeChanged = c.highlightMode !== cfg.highlightMode;
  cfg = c;
  const r = document.documentElement.style;
  r.setProperty("--bg", c.opacity); r.setProperty("--fg", c.color);
  r.setProperty("--fs", c.fontSize + "px"); r.setProperty("--ff", `"${c.fontFamily}"`);
  r.setProperty("--hbg", rgba(c.highlightColor, c.highlightOpacity));
  r.setProperty("--hbgs", rgba(c.highlightColor, +(c.highlightOpacity * 0.35).toFixed(3)));
  r.setProperty("--hfg", c.highlightTextColor);
  r.setProperty("--past", c.pastOpacity); r.setProperty("--fut", c.futureOpacity);
  if (modeChanged) { const i = curIdx; curIdx = -1; setCur(i); }
});

tp.onScript((c) => {
  chunks = c; total = c.length ? c[c.length - 1].b : 0;
  spans = c.map((x) => Object.assign(document.createElement("span"), { className: "w", textContent: x.t + " " }));
  inner.replaceChildren(...spans);
  // frases: cada chunk sabe a qual frase pertence e onde ela começa e termina
  sentOf = []; sentLo = []; sentHi = [];
  let id = 0;
  c.forEach((x, i) => { sentOf[i] = id; sentLo[id] ??= i; sentHi[id] = i; if (x.end) id++; });
  curIdx = -1; scrollY = 0;
});

// palavra (token) -> pedaço do texto que a contém
function chunkOf(tok) {
  let lo = 0, hi = chunks.length - 1;
  while (lo < hi) { const mid = (lo + hi) >> 1; if (tok < chunks[mid].b) hi = mid; else lo = mid + 1; }
  return lo;
}

tp.onPos(({ pos, state: st }) => {
  const now = performance.now();
  state = st; dot();
  if (pos > conf) {
    hist.push([now, pos]);
    while (hist.length && now - hist[0][0] > 3500) hist.shift();
    const [t0, p0] = hist[0];
    if (now - t0 >= 500 && pos > p0) vel = Math.min(6, Math.max(0.8, (pos - p0) / ((now - t0) / 1000)));
    lastProg = now;
  } else if (pos < conf) { hist = []; disp = pos; }
  if (pos !== conf) { conf = pos; confT = now; } // mudança só de estado não reinicia a estimativa
  if (Math.abs(conf - disp) > 12) disp = conf; // pulo longe: vai direto, a rolagem é que desliza
});

function cls(i, idx) {
  return "w" + (i < idx ? " done" : "") + (i === idx ? " cur" : "") +
    (cfg.highlightMode === "frase" && sentOf[i] === sentOf[idx] ? " sent" : "");
}

// só reescreve as classes do trecho que mudou
function setCur(idx) {
  if (!spans.length || idx === curIdx) return;
  let lo, hi;
  if (curIdx < 0) { lo = 0; hi = spans.length - 1; }
  else {
    lo = Math.min(curIdx, idx); hi = Math.max(curIdx, idx);
    for (const k of [curIdx, idx]) { lo = Math.min(lo, sentLo[sentOf[k]]); hi = Math.max(hi, sentHi[sentOf[k]]); }
  }
  for (let i = lo; i <= hi; i++) spans[i].className = cls(i, idx);
  curIdx = idx;
}

function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.1, (now - lastFrame) / 1000); lastFrame = now;
  if (!spans.length) return;
  // antecipação: enquanto você está lendo sem parar, o destaque anda na sua velocidade e não espera a confirmação
  const reading = cfg.lead > 0 && state === "following" && now - lastProg < 3000;
  const target = conf + (reading ? Math.min(cfg.lead, (vel * (now - confT + AHEAD_MS)) / 1000) : 0);
  disp = target >= disp ? target : Math.max(target, disp - dt * 3);
  setCur(chunkOf(Math.min(total - 1, Math.floor(disp + 1e-6))));

  const el = spans[curIdx];
  const maxY = Math.max(0, inner.offsetHeight - text.clientHeight);
  const targetY = Math.min(maxY, Math.max(0, el.offsetTop - text.clientHeight * cfg.anchor));
  const tau = cfg.scrollSmooth / 1000;
  if (tau < 0.001) scrollY = targetY;
  else {
    // pulo grande rola mais devagar, para dar tempo de acompanhar com o olho
    const far = Math.abs(targetY - scrollY) > text.clientHeight * 0.8 ? 2 : 1;
    scrollY += (targetY - scrollY) * (1 - Math.exp(-dt / (tau * far)));
    if (Math.abs(targetY - scrollY) < 0.3) scrollY = targetY;
  }
  const t = `translateY(${-scrollY.toFixed(2)}px)`;
  if (t !== lastTransform) { inner.style.transform = t; lastTransform = t; }
}
requestAnimationFrame(frame);
</script>
</body>
</html>
